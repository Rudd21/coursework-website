<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Сторінку не знайдено | Etran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/images/small-logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/style.css">

<body>

        <header class="error-header">
            <div class="logo">
                <img src="../assets/images/small-logo.svg" alt="Etran Logo">

            <a href="../index.html" class="get-started-button back-home-btn">Повернутися на головну</a>

        <footer class="error-footer">
