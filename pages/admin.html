<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін Панель | Etran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/images/small-logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }
        .admin-sidebar {
            width: 250px;
            background: var(--my-darkgreen);
            color: white;
            padding: 2rem;
        }
        .admin-main {
            flex-grow: 1;
            background: #f4f4f4;
            padding: 3rem;
        }
        .admin-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .login-placeholder {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
        .admin-nav-item {
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .admin-nav-item:hover {
            color: var(--my-lightgreen);
        }
    </style>
</head>

<body>
    <!-- Placeholder for Supabase Auth in the future -->
    <div id="admin-auth" class="login-placeholder admin-card">
        <h2 style="color: var(--my-darkgreen);">Вхід в Адмін Панель</h2>
        <p style="margin: 1rem 0; color: var(--my-gray);">Буде підключено до Supabase Auth</p>
        <form onsubmit="event.preventDefault(); document.getElementById('admin-auth').style.display='none'; document.getElementById('admin-dashboard').style.display='flex';">
            <div class="form-group">
                <label>Email</label>
                <input type="email" value="admin@etran.com" readonly>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" value="********" readonly>
            </div>
            <button type="submit" class="submit-btn">Увійти (Demo)</button>
        </form>
    </div>

    <div id="admin-dashboard" class="admin-layout" style="display: none;">
        <aside class="admin-sidebar">
            <div class="logo" style="margin-bottom: 3rem;">
                <img src="../assets/images/small-logo.svg" alt="">
                <p>Etran Admin</p>
            </div>
            <nav>
                <div class="admin-nav-item">Дашборд</div>
                <div class="admin-nav-item">Статті</div>
                <div class="admin-nav-item">Користувачі</div>
                <div class="admin-nav-item">Налаштування</div>
                <div class="admin-nav-item" onclick="location.reload()" style="margin-top: 2rem; color: #ff6b6b;">Вийти</div>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1 style="color: var(--my-darkgreen); width: auto;">Панель керування</h1>
                <button class="get-started-button" style="width: auto; padding: 0 20px;">+ Нова стаття</button>
            </div>

            <div class="admin-card">
                <h3>Останні статті</h3>
                <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                    <thead>
                        <tr style="text-align: left; border-bottom: 2px solid var(--my-background-gray);">
                            <th style="padding: 1rem 0;">Заголовок</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="admin-posts-list">
                        <!-- Will be populated from JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../assets/js/blog-data.js"></script>
    <script>
        // Simple script to populate admin table
        const tbody = document.getElementById('admin-posts-list');
        if (tbody && typeof blogPosts !== 'undefined') {
            tbody.innerHTML = blogPosts.map(post => `
                <tr style="border-bottom: 1px solid var(--my-background-gray);">
                    <td style="padding: 1rem 0;">${post.title}</td>
                    <td>${post.date}</td>
                    <td><span style="background: #e1f5fe; color: #0288d1; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem;">Опубліковано</span></td>
                    <td>
                        <button style="background: none; border: none; color: var(--my-green); cursor: pointer; margin-right: 10px;">Редагувати</button>
                        <button style="background: none; border: none; color: #ff6b6b; cursor: pointer;">Видалити</button>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>

</html>
