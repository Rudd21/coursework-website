<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог | Etran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/images/small-logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .blog-header {
            background: var(--my-darkgreen);
            padding: 4rem 5%;
            text-align: center;
            color: white;
        }
        .blog-header h1 {
            width: auto;
            margin: 0 auto;
            font-size: 3rem;
        }
        .blog-list-container {
            width: 90%;
            max-width: 1200px;
            margin: 4rem auto;
        }
        .blog-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 3rem;
            padding: 1.5rem;
            background: var(--my-background-gray);
            border-radius: 12px;
            align-items: center;
        }
        .search-input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        .filter-select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }
        .tags-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .tag {
            padding: 4px 12px;
            background: var(--my-lightgreen);
            color: var(--my-darkgreen);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .tag.active {
            background: var(--my-darkgreen);
            color: white;
        }
        .tag:hover {
            opacity: 0.8;
        }
        @media (min-width: 1025px) {
            header {
                position: static;
                width: 100%;
                height: 40vh;
            }
        }
    </style>
</head>

<body>
    <div class="container" style="flex-direction: column;">
        <header class="blog-header">
            <div class="logo" style="margin: 0 auto 2rem; cursor: pointer;" onclick="window.location.href='../index.html'">
                <img src="../assets/images/small-logo.svg" alt="">
                <p>Etran</p>
            </div>
            <h1>Наш Блог</h1>
            <p>Новини, поради та оновлення від команди Etran</p>
        </header>

        <main class="blog-list-container">
            <div class="blog-controls">
                <input type="text" id="blog-search" class="search-input" placeholder="Пошук за назвою або описом...">
                
                <select id="sort-date" class="filter-select">
                    <option value="newest">Спочатку нові</option>
                    <option value="oldest">Спочатку старі</option>
                </select>

                <a href="subscriptions.html" class="get-started-button" style="text-decoration: none; width: auto; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;">Підписатися на теги</a>

                <div id="blog-tags" class="tags-container">
                    <!-- Tags will be injected here -->
                </div>
            </div>

            <div id="all-blog-posts" class="blog-posts-grid">
 
            </div>
        </main>

        <footer style="height: auto; padding: 4rem 5%;">
            <div class="footer-logo">
                <img src="../assets/images/big-logo.svg" alt="">
                <p class="footer-title">Etran</p>
            </div>
            <div class="footer-links">
                <p>&copy; 2024 Etran. Всі права захищені.</p>
            </div>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabaseClient.js"></script>
    <script src="../assets/js/blog-data.js"></script>
</body>

</html>
